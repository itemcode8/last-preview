<style>
/* 레이아웃: 폰 한 칸 폭의 콜 시트. 위에 라운드와 남은 횟수, 아래에 탭. CCTV 화면만 어두운 모니터로 둔다. */
:root{
  --bg:#e8eaec; --surface:#f6f7f8; --ink:#14181c; --muted:#56616b; --line:#cdd3d8;
  --accent:#c62f1d; --accent-ink:#ffffff; --ok:#1d6f48; --warn:#8f6200; --soft:#dde1e5;
  --screen:#0c1411; --screen-ink:#bfe6cc;
  --serif:"Noto Serif KR","Nanum Myeongjo",serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1214; --surface:#171b1f; --ink:#e7eaed; --muted:#98a3ad; --line:#2a3036;
    --accent:#ff6a55; --accent-ink:#1a0a07; --ok:#5fcf9a; --warn:#e3b455; --soft:#20262b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1214; --surface:#171b1f; --ink:#e7eaed; --muted:#98a3ad; --line:#2a3036;
  --accent:#ff6a55; --accent-ink:#1a0a07; --ok:#5fcf9a; --warn:#e3b455; --soft:#20262b; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px 92px}
#app{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:700}
.title{font-family:var(--serif);font-weight:900;font-size:26px;letter-spacing:-.01em;line-height:1.15;text-wrap:balance}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.tc{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.04em}
.status{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.pill{font-family:var(--mono);font-size:12px;padding:3px 9px;border:1px solid var(--line);border-radius:999px;background:var(--surface);white-space:nowrap}
.pill b{font-weight:500;color:var(--accent)}
.sec{margin:18px 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin:0 0 12px}
.panel.alert{border-color:var(--accent)}
.panel h3{font-size:16px;margin-bottom:6px}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--mono)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.list li{padding-left:0}
.tl li{display:grid;grid-template-columns:auto 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible,.tab:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
input[type=text],select{width:100%;min-height:42px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.rows{display:grid;gap:6px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:left;width:100%;cursor:pointer}
.row.static{cursor:default}
.row .k{font-family:var(--mono);font-size:12px;color:var(--muted)}
.row .s{font-size:12px;color:var(--muted)}
.vw{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden}
.vw video{width:100%;height:100%;object-fit:cover;display:block}
.vw span{position:absolute;font-family:var(--mono);font-size:11px;color:#d8efe0;text-shadow:0 0 3px #000}
.vw .vl{left:10px;top:8px}.vw .vt{left:10px;bottom:8px}
.vw .vr{right:10px;top:8px;display:flex;align-items:center;gap:5px;color:#ffb4ab;font-size:10px}
.vw .vr i{width:8px;height:8px;border-radius:50%;background:#ff4a3a;display:block}
.ava{width:72px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line);flex:none;filter:saturate(.85)}
.pf{display:flex;gap:12px;align-items:flex-start}
.tag{font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tag.red{color:var(--accent);border-color:var(--accent)}
.tag.ok{color:var(--ok);border-color:var(--ok)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-family:var(--mono);font-size:12px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.secret{border:1px dashed var(--muted);border-radius:8px;padding:10px 12px;display:grid;gap:8px}
.secret.open{border-style:solid;border-color:var(--line);background:var(--soft)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tab{border:0;background:transparent;padding:12px 4px;font-size:13px;cursor:pointer;color:var(--muted);position:relative;font-weight:500}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::before{content:"";position:absolute;left:22%;right:22%;top:0;height:3px;background:var(--accent);border-radius:0 0 3px 3px}
.dot{position:absolute;top:8px;right:22%;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.monitor{background:var(--screen);border-radius:8px;overflow:hidden;border:1px solid #1f3228}
.monitor svg{display:block;width:100%;height:auto}
.cap{padding:10px 12px;background:#101c16;color:var(--screen-ink);font-size:13px;border-top:1px solid #1f3228}
.cap .mono{color:#7fb394}
.banner{background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:12px 14px;font-weight:600;margin-bottom:12px}
.who{font-weight:600}
.proofs{display:grid;gap:6px;max-height:260px;overflow:auto;padding:2px}
.proofs label{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.proofs input{margin-top:5px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.scroll{overflow-x:auto}
details summary{cursor:pointer;font-weight:600}
@media (prefers-reduced-motion:no-preference){ .flick{animation:fl 3s steps(2) infinite} @keyframes fl{50%{opacity:.82}} }
</style></head><body>

var CH={
 ha:{n:'서하윤',job:'편집감독',culprit:true,
  pub:'서하윤, 41세. 강태식 감독의 영화 네 편을 편집한 편집감독이다. 말수가 적고 한번 맡은 일은 끝까지 붙들고 있는 타입이라 현장에서는 "편집실의 주인"으로 불린다. 이번에는 재개봉판 최종본을 시사회 전에 마무리하기 위해 별장에 와서, 이틀째 편집실에서 지내고 있다.',
  why:"강태식 감독이 재개봉판 최종본을 시사회 전날 밤까지 끝내 달라고 불렀다. 겉으로는 마무리 편집이지만, 내가 진짜로 확인하려는 건 R-7이 아직 안전하냐는 것이다. 감독이 R-7을 따로 챙기라는 말을 몇 번 흘려서 불안했다. 편집실의 녹화 장비(NVR)도 내가 설치했고, 그 관리자 권한을 쥔 사람은 감독과 나뿐이다.",
  ties:["감독과: 20년 동안 감독 이름으로 나간 네 편의 실제 연출은 내가 했다. 크레딧에는 편집이라는 한 줄뿐이다. 이번 재개봉에서는 원본 R-7이 내가 연출했다는 유일한 증거인데, 감독이 그걸 태우려 한다.", "만재와: 30년을 같이 일한 제작자라 내가 연출했다는 걸 안다. 그런데 감독 앞에서 한 번도 내 편을 들어 주지 않았다.", "여경과: 20년 알고 지낸 사이다. 내가 크레딧 문제로 감독에게 거절당하는 걸 여러 번 봤다. 부부 사이가 좋지 않다는 건 느낌으로 안다.", "세헌과: 내가 편집한 작품으로 이름을 알린 배우다. 요즘 일이 뜸한 건 안다.", "도현과: 연출 노트를 보여 주며 가르치다시피 한 조감독이다. 요즘 뭔가를 쓰고 있다는 건 안다.", "은솔과: 감독의 일정과 서류를 맡은 사람이라 감독의 움직임을 가장 가까이서 본다."],
  truth:["22:30~22:57 편집실에서 SC.47 컷을 이어 붙였다. 머그잔의 차를 마셨다.", "22:52 감독이 시사실에서 내선을 걸었다(47초). \"R-7은 내일 시사 전에 태운다. 마지막으로 와서 봐라.\" 나는 대꾸 없이 수화기를 내려놓았다.", "22:57 작업을 저장하고 머그잔을 책상 오른쪽 끝으로 밀어 두었다. 22:59 편집실 NVR 콘솔에서 CAM3 입력을 28분 지연 재생으로 바꿨다. 장갑 상자에서 흰 면장갑 한 켤레를 꺼내 주머니에 넣고 편집실을 나섰다.", "23:01 뒷계단 문을 열고 내려가며 장갑을 꼈다. 23:03:30 시사실에 도착했다.", "23:07 시사실에서 R-7을 두고 감독과 몸싸움이 났다. 선반의 필름 캔으로 감독을 쳤다. 이때 소매 단추가 떨어졌다.", "23:10 R-7 릴을 챙겨 시사실 문을 나섰다. 23:11 뒷계단 주방 쪽 문으로 나와 주방에 들어갔다.", "23:11~23:18 주방에서 손과 소매를 씻고 행주로 소매의 보풀을 닦았다. 젖은 장갑은 쓰레기통에 버렸다.", "23:18 뒷계단 주방 쪽 문을 열고 올라가 23:19:30 편집실로 돌아와 R-7을 책상 서랍에 숨겼다. 23:22 CAM2의 22:58~23:22를 삭제했고, 23:25 CAM3를 라이브로 돌렸다."],
  sec:[
   {id:'ha1',t:'이 영화의 진짜 연출자는 나다. 연출 노트와 원본 필름 R-7이 증거다.'},
   {id:'ha2',t:'감독이 R-7을 몰래 태우려는 걸 알았고, 오늘 밤 되찾을 계획을 세웠다.'},
   {id:'ha3',t:'NVR 관리자 비밀번호를 아는 사람은 감독과 나뿐이다. 오늘 밤 CAM3를 내가 조작했다.'}],
  mission:'끝까지 범인으로 지목되지 않는다. 지목되더라도 상대가 증거를 두 가지 이상 대지 못하면 승리한다.'},
 se:{n:'윤세헌',job:'주연배우',
  pub:'윤세헌, 47세. 10년 전까지 천만 관객 영화의 주연을 맡던 배우로, 요즘은 큰 작품 소식이 뜸하다. 화려하고 말이 많지만 속내는 잘 드러내지 않는다. 재개봉 홍보를 이유로 시사회 전야 모임에 초대받아 오늘 저녁 별장에 도착했고, 감독을 만나 이야기해야 한다고 했다.',
  why:"감독이 시사회 전야 모임에 불러서 \"재개봉 홍보 인터뷰 건으로 할 이야기가 있다\"고 했다. 이 바닥에서 내 마지막 기회라 거절할 수 없었다. 하지만 합의서 서명을 압박하려는 자리일 거라는 걸 짐작하고, 감독에게 직접 따지러 왔다. 겨울 별장이라 폭설이 오기 전에 도착했다.",
  ties:["감독과: 10년 전 출연료 분쟁 뒤 감독이 나를 \"다루기 힘든 배우\"라고 업계에 소문냈다. 그 뒤로 큰 작품이 끊겼고, 오늘 밤 합의서에 서명할 것을 강요당했다.", "만재와: 내 출연료 일부를 만재가 장부 밖 현금으로 줬다. 밀린 돈을 장부에 올리라고 하다가 다퉜다. 만재는 \"그 장부 건드리면 당신도 끝이야\"라고 받아쳤다. 나도 약점이 있어서 크게 나서지 못한다.", "도현과: 22:30 말다툼을 맞은편에서 노트북을 치던 도현이 들었다. 눈치가 빠른 편이라 신경 쓰인다.", "하윤과: 내 대표작을 편집한 사람이다. 가끔 편집실에 들러 이야기를 나눈다. 내 쪽에 가까운 사람이라고 믿는다.", "여경과: 신인 시절 투자자 모임을 소개해 준 사람이다. 사이는 나쁘지 않지만 감독 부인이라 속내를 다 말하지는 못한다.", "은솔과: 서재 금고를 관리하는 사람이라는 건 안다. 말수가 적어 속을 알기 어렵다."],
  truth:["저녁에 도착해 거실에서 와인을 마시며 감독을 기다렸다. 감독은 서재에서 나오지 않았다.", "22:30 거실에서 만재와 장부 문제로 말다툼을 했다. 말다툼은 2분쯤 이어졌고 도현이 맞은편에서 듣고 있었다.", "22:48 서재에 들어가 22:50 금고를 열고 22:53까지 내 계약서(이미 억지로 서명한 합의서)를 꺼냈다.", "22:53~23:01 서재에서 합의서를 읽으며 화를 삭였다. 23:01 거실로 돌아와 소파에 앉았다.", "23:04 빈 잔을 들고 주방으로 갔다. 23:06, 23:08 제빙기로 얼음을 받았다.", "23:11 주방을 나서 복도를 걷다 뒤를 돌아보니, 복도 끝 뒷계단 문에서 나온 사람이 소매를 걷어 올리며 주방으로 들어가는 뒷모습이 보였다. 누구인지는 못 봤다.", "23:12 얼음잔을 들고 거실로 돌아와 소파에 앉아 있었다."],
  sec:[
   {id:'se1',t:'금고에서 꺼낸 것은 감독이 나를 업계에서 퇴출하려고 만든 합의서다. 서명은 억지로 했다.'},
   {id:'se2',t:'"언젠가 죽여 버리겠다"고 감독에게 보낸 문자가 내 휴대폰에 남아 있다.'},
   {id:'se3',t:'23:11 주방을 나서다 복도 끝 뒷계단 문에서 나온 사람이 소매를 걷어 올리며 주방으로 들어가는 뒷모습을 봤다. 얼굴은 못 봤다.'}],
  mission:'첫 번째 비밀(합의서)이 끝까지 드러나지 않게 하고, 범인을 맞힌다.'},
 ma:{n:'오만재',job:'제작자',
  pub:'오만재, 58세. 강태식 감독과 데뷔 때부터 함께해 온 제작자다. 투자자를 모으고 제작비를 굴리는 일을 도맡아 왔고, 사람 좋은 웃음 뒤에 계산이 빠르다는 평을 듣는다. 이번 재개봉의 투자금과 정산도 그가 관리한다. 시사회에 앞서 투자자 보고를 준비하러 하루 일찍 도착했다.',
  why:"재개봉 투자금의 최종 정산서를 투자자 보고 전에 감독에게 건네려고 왔다. 감독이 어제 회계 자료를 직접 보겠다고 해서, 시사회 전에 장부를 손봐야 한다는 불안에 하루 일찍 도착했다. 그래서 지하 보관실의 위치와 환기, 연기 경보 설정을 미리 확인해 두었다.",
  ties:["감독과: 30년 동료지만 이번 재개봉 투자금 4억 원을 몰래 빼 썼다. 감독이 어제 회계 자료를 보여 달라고 했고, 시사회 뒤 투자자들에게 알리겠다고 했다.", "세헌과: 세헌의 출연료 일부를 장부 밖 현금으로 줬다. 장부가 드러나면 세헌도 같이 곤란해진다. 그래서 \"당신도 끝이야\"라고 말했다.", "하윤과: 감독과 크레딧 문제로 자주 부딪히는 편집감독이다. 내가 중재해 준 적은 없다.", "여경과: 감독 부인이다. 남편이 나를 의심한다는 말이 부인 귀에 들어갔을까 불안하다.", "도현과: 22:30 말다툼을 도현이 들었다. 조감독이라 감독에게 말이 들어갈까 걱정된다.", "은솔과: 감독의 서류를 모두 만지는 사람이라 내 정산서의 숫자가 안 맞는 걸 눈치챘을까 불안하다."],
  truth:["저녁 8시쯤 도착해 서류가방에 불태울 장부를 넣어 두었다. 가방은 거실 소파 옆에 두었다.", "22:30 거실에서 세헌과 말다툼을 했다. 세헌에게 \"그 장부 건드리면 당신도 끝이야.\"라고 말했다.", "22:44 주방으로 가서 물을 마셨다. 22:56 서류가방과 라이터를 들고 지하 계단으로 내려갔다.", "22:58~23:21 지하 보관실에서 횡령 장부를 한 장씩 태웠다. 연기 경보를 23:02~23:20 일시정지해 뒀다.", "23:21 소매에 재가 묻은 채 빈 가방을 들고 지하에서 올라왔다.", "필름 승강기는 21:40 이후 쓰지 않았다. 지하에서는 시사실 쪽 소리를 듣지 못했다."],
  sec:[
   {id:'ma1',t:'재개봉 투자금 4억 원을 횡령했고, 감독이 알아챘다.'},
   {id:'ma2',t:'오늘 밤 지하 보관실에서 횡령 장부를 태웠다.'},
   {id:'ma3',t:'감독이 시사 전에 필름 한 롤(R-7)을 없애려 한다는 말을 2주 전에 들었다. 이유는 모른다. 지하 필름 승강기로 시사실에 갈 수 있다는 것도 안다.'}],
  mission:'두 번째 비밀(장부를 태운 일)이 끝까지 드러나지 않게 하고, 범인을 맞힌다.'},
 yo:{n:'민여경',job:'감독의 아내',
  pub:'민여경, 52세. 강태식 감독의 아내이자 한때 감독의 영화에 투자자로 참여했던 사람이다. 우아하고 차분해서 모임에서는 늘 중재자 역할을 한다. 투자자들 앞에 감독 부부로 서야 하는 시사회를 위해 전날 밤 별장에 와 있다.',
  why:"감독이 마지막 시사회에 아내로서 동반해야 한다고 요구했다. 투자자들 앞에서 부부의 모습이 필요하다는 이유였다. 나는 이혼 전 마지막 행사로 생각하고 왔고, 유언장을 바꾸려 한다는 소문이 사실인지 확인하려는 마음도 있었다. 별장에는 감독과 따로 도착했다.",
  ties:["감독과: 결혼 25년. 감독의 외도와 무시로 부부 사이는 이미 끝났다. 이혼하면 내 몫은 거의 남지 않는데, 감독은 유언장에서도 나를 지우려 한다는 소문을 들었다.", "은솔과: 감독의 서류를 다루는 사람이다. 나를 보면 시선을 피한다.", "하윤과: 20년 알고 지낸 사이다. 하윤이 크레딧 문제로 감독과 부딪히는 걸 여러 번 봤다. 편이 되어 주고 싶었지만 부인 처지라 말을 못 했다.", "만재와: 남편의 오랜 동업자다. 요즘 둘 사이 분위기가 좋지 않다는 건 느낀다.", "세헌과: 신인 시절 투자자 모임을 소개해 준 배우다. 감독이 그를 업계에서 밀어낸 걸 안다. 미안한 마음이 있다.", "도현과: 남편이 쓰다 버릴 사람이라고 말한 적이 있는 조감독이다."],
  truth:["저녁에 감독과 따로 도착했다. 22:00경 거실에서 손님들과 인사를 나눴다.", "22:30 서재에 들어가 책상 서랍에서 유언장 수정 초안을 읽었다. 내 몫이 삭제돼 있었다. 감독은 서재에 없었다.", "22:46 초안을 복사한 사본을 서류봉투에 넣어 안고 2층으로 올라가 22:47 침실에 들어갔다.", "22:55 침실에서 감독에게 \"시사회 전에 전부 터뜨리겠다\"는 음성 메시지를 남겼다.", "23:04 침실 지문 금고 인식 오류. 23:09 인식 성공. 금고 안쪽에서 유언장 변경 사본을 찾아 그 안쪽 칸에 다시 숨겼다.", "23:35까지 침실에 있다가 서류를 안고 나왔다."],
  sec:[
   {id:'yo1',t:'유언장 수정 초안에서 내 몫이 삭제된 것을 읽었다.'},
   {id:'yo2',t:'침실 금고에서 유언장 변경 사본을 찾아 숨겼다.'},
   {id:'yo3',t:'감독에게 "시사회 전에 전부 터뜨리겠다"는 음성 메시지를 남겼다.'}],
  mission:'두 번째 비밀(변경 사본)이 끝까지 드러나지 않게 하고, 범인을 맞힌다.'},
 do:{n:'차도현',job:'조감독',
  pub:'차도현, 33세. 감독 밑에서 8년째 조감독으로 일해 온 막내급 스태프이자, 자기 시나리오로 데뷔하길 꿈꾸는 작가 지망생이다. 성실하고 눈치가 빠르며 현장의 소소한 일을 모두 기억한다. 이번 재개봉에서는 시사회 진행을 보조하며 별장에 머물고 있다.',
  why:"감독이 재개봉 시사회 진행 보조를 맡겼다. 거절하면 이 업계에서 더 일하기 어렵다는 걸 알고 왔다. 내 노트북에는 이번 대본의 원고 파일이 들어 있고, 감독의 대본이 내 원고와 같은지 대조해 증거를 확보하려고 챙겨 왔다.",
  ties:["감독과: 8년째 조감독으로 일했다. 감독이 내 시나리오 아이디어를 가져가면서 이름은 넣어 주지 않았고, 이번 재개봉 대본이 사실상 내 원고다.", "세헌·만재와: 22:30 거실에서 두 사람이 장부 문제로 다투는 걸 노트북을 치며 들었다. 누구에게도 말하지 않았다.", "하윤과: 현장 연출 감각을 많이 배운 선배다. 편집실에서 밤을 새우는 일이 잦다.", "여경과: 감독 부부 사이가 좋지 않다는 건 알지만, 자세한 사정은 모른다.", "은솔과: 감독의 서류를 관리해서 내 원고 출력본도 은솔이 감독 서재로 가져간 걸 안다."],
  truth:["22:00 감독 지시로 시사회 진행표를 정리하며 거실에서 노트북으로 작업했다.", "22:30 거실에서 노트북으로 작업하며 세헌과 만재의 장부 말다툼을 들었다.", "22:38 2층으로 올라가 22:41 203호에 들어갔다. 203호에서 노트북의 원고 파일과 감독의 대본을 비교했다.", "23:11 몰래 203호를 나와, 편집실에 비치된 최종 대본 출력본과 내 원고를 대조하러 편집실로 갔다.", "23:12 편집실은 비어 있었다. 머그잔은 오른쪽 끝에 있었고, 모니터에는 설정 창이 떠 있었고, 구석에 \"−28\" 비슷한 숫자가 눈에 들어왔지만 무슨 뜻인지는 몰랐다. 책상에는 하윤의 연출 노트가 펼쳐져 있었다.", "23:18 뒷계단 쪽에서 발소리가 나서 놀라 나왔고, 23:19 203호로 돌아왔다."],
  sec:[
   {id:'do1',t:'감독의 재개봉작 대본이 내 시나리오와 거의 같다. 증거는 내 노트북에 있다.'},
   {id:'do2',t:'23:11~23:18 편집실에 몰래 들어갔다. 방은 비어 있었고 머그잔은 오른쪽 끝에 있었다. 책상에는 하윤의 연출 노트가 펼쳐져 있었다.'},
   {id:'do3',t:'편집실 모니터에 설정 창이 떠 있었고 구석에 "−28" 비슷한 숫자가 보였다. 무슨 뜻인지는 몰랐다. 23:18 뒷계단 쪽에서 발소리가 나서 나왔다.'}],
  mission:'두 번째 비밀(편집실에 몰래 들어간 일)이 끝까지 드러나지 않게 하고, 범인을 맞힌다.'},
 eu:{n:'고은솔',job:'비서',
  pub:'고은솔, 45세. 20년 동안 강태식 감독의 일정과 서류, 연락을 관리해 온 비서다. 늘 조용히 일하며 표정을 잘 드러내지 않는다. 이번 시사회 준비를 위해 며칠 전부터 별장에서 감독의 서류를 정리해 왔다.',
  why:"20년 동안 해 온 대로 감독의 일정, 서류, 투자자 연락을 챙기러 왔다. 이번에는 감독이 따로 불러 \"시사회 끝나면 이야기하자\"고 했다. 해고 통보일 거라고 짐작한다. 그 전에 10년 전 사고 서류를 어떻게든 처리해야 한다는 생각으로 서류 가방을 직접 정리했다.",

ev('D-03','r203',3,'도현이 받은 메일 출력본','감독이 도현에게 보낸 메일 출력본. "공동 크레딧은 없다. 원고는 내가 쓴 걸로 정리한다. 불만이면 이 업계에서 일 못 한다."');
ev('K-04','kit',3,'서류 가방 속 사고 경위서 사본','10년 전 촬영장 사고 경위서 사본. 사망 원인이 "스태프 개인 과실"로 적혀 있고 작성자란에 "고은솔"의 서명이 있다. 유족 연락처 칸에 "고은솔(고인의 오랜 친구)"이 적혀 있다.',{lock:3});

var G1='#bfe6cc',G2='#d7f3df',G3='#7fb394',LN='#34513f';
function person(x,y,label,op,sc){
  sc=sc||1;
  return '<g transform="translate('+x+' '+y+') scale('+sc+')" opacity="'+(op==null?1:op)+'"><circle cx="0" cy="-17" r="6" fill="'+G2+'"/><path d="M-9 8 Q-9 -9 0 -9 Q9 -9 9 8 Z" fill="'+G1+'"/>'
    +'<text y="20" text-anchor="middle" font-size="9" font-family="monospace" fill="'+G3+'">'+esc(label)+'</text></g>';
}
function prop(kind,x,y){
  if(kind==='env')return '<rect x="'+(x+8)+'" y="'+(y-8)+'" width="11" height="8" fill="none" stroke="'+G1+'"/><path d="M'+(x+8)+' '+(y-8)+' l5.5 4 l5.5 -4" fill="none" stroke="'+G1+'"/>';
  if(kind==='lap')return '<rect x="'+(x+8)+'" y="'+(y-6)+'" width="14" height="9" fill="none" stroke="'+G1+'"/>';
  if(kind==='glass')return '<path d="M'+(x+9)+' '+(y-8)+' h8 l-1.5 10 h-5 z" fill="none" stroke="'+G1+'"/>';
  if(kind==='ice')return '<path d="M'+(x+9)+' '+(y-8)+' h8 l-1.5 10 h-5 z" fill="none" stroke="'+G1+'"/><rect x="'+(x+11)+'" y="'+(y-5)+'" width="3" height="3" fill="'+G2+'"/><rect x="'+(x+14)+'" y="'+(y-3)+'" width="3" height="3" fill="'+G2+'"/>';
  if(kind==='bag')return '<rect x="'+(x+8)+'" y="'+(y-6)+'" width="13" height="12" rx="2" fill="'+G1+'" opacity=".75"/>';
  if(kind==='flat')return '<rect x="'+(x+8)+'" y="'+(y+1)+'" width="13" height="4" rx="1" fill="'+G1+'" opacity=".6"/>';
  if(kind==='lighter')return '<circle cx="'+(x-12)+'" cy="'+(y-6)+'" r="2.5" fill="#fff"/><path d="M'+(x-12)+' '+(y-12)+' l1.5 -4 l1.5 4" stroke="#ffd27a" fill="none"/>';
  if(kind==='soot')return '<circle cx="'+(x-8)+'" cy="'+(y+2)+'" r="3" fill="#050a08"/><circle cx="'+(x-4)+'" cy="'+(y+6)+'" r="2" fill="#050a08"/>';
  return '';
}
function peopleBlock(list,slots){
  var o='';
  list.forEach(function(q){
    var p=slots[q[1]];if(!p)return;
    var pr=q[2]||'';var op=1,y=p[1];
    if(pr.indexOf('enter')>=0){op=.55;y=p[1]-18;}
    if(pr.indexOf('exit')>=0){op=.8;y=p[1]-12;}
    o+=person(p[0],y,LB[q[0]],op);
    pr.split(' ').forEach(function(k){if(k&&k!=='enter'&&k!=='exit')o+=prop(k,p[0],y);});
  });
  return o;
}

function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

  var h='<div class="sec">방장</div><div class="panel"><div class="btns" style="margin-top:0">';
  if(G.phase==='play'){
    var done=0,rows=(G.roster||[]).map(function(id){var u=evs().filter(function(e){return e.k==='find'&&e.by===id&&e.r===round();}).length;var ok=u>=S_PER;if(ok)done++;return '<div class="small" style="padding:2px 0">'+(ok?'✓ ':'· ')+esc(pname(id))+' <span class="muted">'+Math.min(u,S_PER)+'/'+S_PER+'</span></div>';}).join('');
    h+='</div><p class="small" style="margin:10px 0 4px"><b>조사 완료 '+done+'/'+(G.roster||[]).length+'명</b> <span class="muted">· 이번 라운드 조사 횟수를 모두 쓴 사람</span></p>'+rows+'<div class="btns" style="margin-top:10px">';
    h+='<button class="btn primary" data-act="next">'+(round()<MAXR?(done<(G.roster||[]).length?'그래도 다음 라운드로':'다음 라운드로'):'투표 시작')+'</button>';
  }
  if(false)h+='<button class="btn primary" data-act="next">'+(round()<MAXR?'다음 라운드로':'투표 시작')+'</button>';
  if(G.phase==='vote')h+='<button class="btn primary" data-act="end">결과 공개</button>';
  h+='<button class="btn" data-act="reset">새 게임(로비로)</button></div></div>';
  return h;
}
function endTab(){
  var m=assign(),votes=Object.keys(VT).filter(function(id){return VT[id].g===G.gameId;}).map(function(id){return {id:id,v:VT[id]};});
  var tally={};votes.forEach(function(x){tally[x.v.s]=(tally[x.v.s]||0)+1;});
  var top=Object.keys(tally).sort(function(a,b){return tally[b]-tally[a];})[0];
  var valid=votes.filter(function(x){
    if(x.v.s!=='ha')return false;
    var s={};(x.v.proofs||[]).forEach(function(k){s[k]=1;});
    return CATS.filter(function(c){return c.ok(s);}).length>=2;});
  var uniq=!Object.keys(tally).some(function(k){return k!=='ha'&&tally[k]>=(tally.ha||0);});
  var win=(top==='ha'&&uniq&&tally.ha>=Math.max(1,Math.ceil(votes.length/2))&&valid.length>=1);
  var culprit=null;Object.keys(m).forEach(function(id){if(m[id]==='ha')culprit=id;});
  var h='<div class="banner">'+(win?'범인 서하윤이 잡혔습니다. 시민 승리.':'서하윤이 빠져나갔습니다. 범인 승리.')+'</div>';
  h+='<div class="panel"><h3>진상</h3>'+TRUTH_TEXT.map(function(t){return '<p>'+esc(t)+'</p>';}).join('')+'<p class="small muted">서하윤 역은 '+esc(culprit?pname(culprit):'(없음)')+'였습니다.</p></div>';
  h+='<div class="sec">투표 결과</div><div class="rows">';
  votes.forEach(function(x){var s={};(x.v.proofs||[]).forEach(function(k){s[k]=1;});var cs=CATS.filter(function(c){return c.ok(s);}).map(function(c){return c.n;});
    h+='<div class="row static" style="grid-template-columns:1fr"><div><span class="who">'+esc(who(x.id))+'</span> → '+esc(CH[x.v.s]?CH[x.v.s].n:'')+'<div class="small muted">'+(x.v.s==='ha'?(cs.length?'인정된 근거: '+esc(cs.join(', ')):'인정된 근거 없음'):'')+'</div></div></div>';});
  if(!votes.length)h+='<p class="muted small">투표가 없습니다.</p>';
  var MS={ha:{culprit:1},se:{sec:0,vote:1},ma:{sec:1,vote:1},yo:{sec:1,vote:1},'do':{sec:1,vote:1},eu:{sec:0,sec2:1,vote:1}};
  var sc=Object.keys(m).map(function(id){
    var c=m[id],ms=MS[c],v=VT[id]&&VT[id].g===G.gameId?VT[id]:null,pts=0,L=[];
    var voted=v&&v.s==='ha';
    var ok=true;
    if(ms.culprit){ok=!win;}
    else{
      if(ms.sec!=null){var sid=CH[c].sec[ms.sec].id;if(secExposed(sid))ok=false;}
      if(ms.sec2!=null){var sid2=CH[c].sec[ms.sec2].id;if(secExposed(sid2))ok=false;}
      if(ms.vote&&!voted)ok=false;
    }
    if(ok){pts+=3;L.push('개인 미션 달성 +3');}else L.push('개인 미션 실패');
    if(ms.culprit){if(!win){pts+=2;L.push('끝까지 잡히지 않음 +2');}}
    else{
      if(voted){pts+=2;L.push('범인 적중 +2');var s2={};(v.proofs||[]).forEach(function(k){s2[k]=1;});if(CATS.filter(function(x){return x.ok(s2);}).length>=2){pts+=1;L.push('근거 인정 +1');}}
      else L.push(v?'범인 지목 실패':'투표 안 함');
    }
    return {id:id,c:c,pts:pts,L:L};
  }).sort(function(a,b){return b.pts-a.pts;});
  var best=sc.length?sc[0].pts:0;
  var tops=sc.filter(function(x){return x.pts===best;});
  h=h.replace('<div class="panel"><h3>진상</h3>','<div class="panel" style="text-align:center"><div class="small muted">최종 승자</div><div style="font-size:24px;font-weight:700;margin:6px 0">🏆 '+(tops.length?tops.map(function(x){return esc(who(x.id))+' ('+esc(CH[x.c].n)+')';}).join(' · '):'없음')+'</div><div class="small muted">'+best+'점'+(tops.length>1?' · 공동 우승':'')+'</div></div><div class="panel"><h3>진상</h3>');
  h+='</div><div class="sec">점수</div><div class="rows">';
  sc.forEach(function(x){h+='<div class="row static" style="grid-template-columns:1fr auto"><div><span class="who">'+esc(who(x.id))+'</span> <span class="small muted">'+esc(CH[x.c].n)+'</span><div class="small">'+esc(CH[x.c].mission)+'</div><div class="small muted">'+esc(x.L.join(' · '))+'</div></div><div style="font-size:22px;font-weight:700">'+x.pts+(x.pts===best&&best>0?' 🏆':'')+'</div></div>';});
  h+='</div><p class="small muted">미션은 앱이 공개된 비밀과 투표로 자동 계산했습니다. 시민 쪽이 이기면 서하윤은 미션 실패입니다.</p>'+hostPanel();
  return h;
}

function render(){
  if(!db){app.innerHTML=head().replace('<div class="status"></div>','')+'<div class="panel alert"><h3>데이터 연결이 필요합니다</h3><p class="small">공유 저장소(Firebase) 설정이 아직 연결되지 않았습니다. 방장에게 알려 주세요.</p></div>';return;}
  if(!ready){app.innerHTML=head()+'<p class="muted">불러오는 중</p>';return;}
  var h=head();
  var inGame=G&&G.phase!=='lobby';
  if(!inGame){app.innerHTML=h+lobby();return;}
  var body='';
  if(tab==='card')body=cardTab();else if(tab==='cctv')body=cctvTab();else if(tab==='evid')body=evidTab();else if(tab==='map')body=mapTab();else if(tab==='log')body=logTab();else body=voteTab();
  var tabs=[['card','내 카드'],['cctv','CCTV'],['evid','조사'],['map','지도'],['log','기록'],['vote',G.phase==='ended'?'결과':'투표']];
  var navh='<nav class="tabs" role="tablist" aria-label="화면">'+tabs.map(function(t){return '<button class="tab" role="tab" data-act="tab" data-t="'+t[0]+'" aria-selected="'+(tab===t[0])+'">'+t[1]+'</button>';}).join('')+'</nav>';
  app.innerHTML=h+body+navh;
}

app.addEventListener('click',function(ev0){
  var b=ev0.target.closest('[data-act]');if(!b||b.disabled)return;
  var a=b.getAttribute('data-act'),id=b.getAttribute('data-id');
  if(a==='tab'){tab=b.getAttribute('data-t');panel=null;render();return;}
  if(a==='leave')doLeave();else if(a==='join')doJoin();else if(a==='start')doStart();else if(a==='next')doNext();else if(a==='end')doEnd();else if(a==='reset')doReset();else if(a==='fullreset'){if(!resetArm){resetArm=true;clearTimeout(resetT);resetT=setTimeout(function(){resetArm=false;render();},4000);render();}else{resetArm=false;clearTimeout(resetT);doFullReset();}}
  else if(a==='search')doSearch(b.getAttribute('data-room'));
  else if(a==='unlock')doUnlock(id);
  else if(a==='reveal')doReveal(id);
  else if(a==='clip'){panel={k:'clip',id:id};render();}
  else if(a==='closepanel'){panel=null;render();}
  else if(a==='gocctv'){tab='cctv';panel={k:'clip',id:id};render();}
  else if(a==='shareall'){doShare(id,'all');}
  else if(a==='shareone'){var to=shareTo[id];if(!to){note('보여 줄 사람을 고르세요.');return;}doShare(id,to);}
  else if(a==='vote')doVote();
});
app.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='nm')nameDraft=t.value;
});
app.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='va'){viewAs=t.value||null;render();}
  else if(t.id==='sh'){shareTo[t.getAttribute('data-id')]=t.value;}
  else if(t.name==='sus'){vdraft.s=t.value;}
  else if(t.hasAttribute&&t.hasAttribute('data-pf')){vdraft.p[t.getAttribute('data-pf')]=t.checked;}
});

/* ---------- 연결 ---------- */
function snapDocs(s){var o={};s.docs.forEach(function(d){o[d.id]=d.data();});return o;}
async function boot(){
  render();
  try{
    if(!window.firebase||!window.FIREBASE_CONFIG)throw new Error('config');
    firebase.initializeApp(window.FIREBASE_CONFIG);db=firebase.firestore();
    usr={id:async function(){return localId();},isOwner:async function(){try{return new URLSearchParams(location.search).get('h')===window.HOST_KEY;}catch(e){return false;}}};
  }catch(e){db=null;}
  if(!db){render();return;}
  try{myId=(usr&&await usr.id())||localId();isOwner=usr?await usr.isOwner():false;}catch(e){myId=localId();}
  var firstGame=false,firstP=false;
  function go(){if(firstGame&&firstP){ready=true;}render();}
  db.doc('game/state').onSnapshot(function(s){G=s.exists?s.data():null;if(!G){firstGame=true;/* 첫 실행: 로비 문서를 만든다 */G={phase:'lobby',round:1,roster:[],gameId:'l0'};}firstGame=true;go();},function(){firstGame=true;go();});
  db.collection('players').onSnapshot(function(s){P=snapDocs(s);firstP=true;go();},function(){firstP=true;go();});
  db.collection('events').orderBy('t','asc').limit(1000).onSnapshot(function(s){EV=s.docs.map(function(d){return d.data();});render();},function(){});
  db.collection('votes').onSnapshot(function(s){VT=snapDocs(s);render();},function(){});
}
boot();
})();
</script>
